# =====================================================
# deploy.yml — CI/CD GitHub Actions
# Déploiement automatique sur o2switch à chaque push
# sur la branche master
# =====================================================

name: Deploy Project Manager

on:
  push:
    branches:
      - master

jobs:
  # =====================
  # JOB 1 — Build Frontend React
  # =====================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # Checkout du code
      - name: Checkout
        uses: actions/checkout@v4

      # Installation Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # Installation des dépendances
      - name: Install dependencies
        run: npm ci

      # Build de production
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_DROPBOX_APP_KEY: ${{ secrets.VITE_DROPBOX_APP_KEY }}

      # Upload des artifacts de build
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  # =====================
  # JOB 2 — Deploy sur o2switch via FTP
  # =====================
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: build-frontend

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      # Déploiement FTP sur o2switch
      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: /public_html/project-manager/

  # =====================
  # JOB 3 — Deploy Backend Symfony sur o2switch
  # =====================
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via Webhook
        run: |
          curl --http1.1 -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}"

